
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products | FyndIt Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Admin Header -->
    <header class="admin-header">

        <div class="admin-header-container">

            <a href="admin.html" class="admin-logo">
                <span>fyndit.</span>
                <small>ADMIN</small>
            </a>

            <div class="admin-header-actions">

                <a href="admin.html" class="admin-card-link">
                    Dashboard
                </a>

                <button id="adminLogoutButton">
                    Logout
                </button>

            </div>

        </div>

    </header>


    <!-- Page Heading -->
    <section class="admin-page-heading">

        <p>PRODUCT MANAGEMENT</p>

        <h1>Manage Products</h1>

        <span>
            Add, edit and manage your FyndIt product collection.
        </span>

    </section>


    <!-- Product Management -->
    <main class="admin-products-section">

        <div class="admin-products-toolbar">

            <div>
                <h2>All Products</h2>

                <p id="adminProductCount">
                    Loading products...
                </p>
            </div>

            <button id="addProductButton">
                + Add New Product
            </button>

        </div>


        <!-- Search -->
        <div class="admin-product-search">

            <input
                type="text"
                id="adminProductSearch"
                placeholder="Search products by name or ID..."
            >

        </div>


        <!-- Product Table -->
        <div class="admin-table-container">

            <table class="admin-products-table">

                <thead>

                    <tr>
                        <th>Product ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="adminProductsTableBody">

                    <tr>
                        <td colspan="7">
                            Loading products...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>


        <!-- Page Message -->
        <p
            id="adminProductsMessage"
            class="admin-dashboard-message"
        ></p>

    </main>


    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="admin-modal">

        <div class="admin-modal-content">

            <div class="admin-modal-header">

                <h2 id="productModalTitle">
                    Add New Product
                </h2>

                <button
                    type="button"
                    id="closeProductModal"
                >
                    &times;
                </button>

            </div>


            <form id="adminProductForm">

                <input
                    type="hidden"
                    id="adminProductId"
                >

                <div class="admin-form-field">

                    <label for="adminProductName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="adminProductName"
                        required
                    >

                </div>


                <div class="admin-form-field">

                    <label for="adminProductCategory">
                        Category
                    </label>

                    <select
                        id="adminProductCategory"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                    </select>

                </div>


                <div class="admin-form-field">

                    <label for="adminProductPrice">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="adminProductPrice"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <div class="admin-form-field">

                    <label for="adminProductStock">
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="adminProductStock"
                        min="0"
                        step="1"
                        required
                    >

                </div>


                <div class="admin-form-field">

                    <label for="adminProductDescription">
                        Description
                    </label>

                    <textarea
                        id="adminProductDescription"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="admin-form-field">

                    <label for="adminProductImage">
                        Product Image URL (Optional)
                    </label>

                    <input
                        type="url"
                        id="adminProductImage"
                        placeholder="https://example.com/image.jpg"
                    >

                </div>


                <div class="admin-form-field">

                    <label for="adminProductStatus">
                        Product Status
                    </label>

                    <select
                        id="adminProductStatus"
                        required
                    >

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="admin-form-actions">

                    <button
                        type="button"
                        id="cancelProductButton"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveProductButton"
                    >
                        Save Product
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Footer -->
    <footer class="main-footer">

        <p>
            © 2026 FyndIt. Everything worth finding.
        </p>

    </footer>


    <script src="firebase-config.js"></script>
    <script src="admin-products.js"></script>

</body>

</html>
