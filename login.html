
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FyndIt</title>

    <meta name="description" content="Sign in to your FyndIt account.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">

        <div class="header-container">

            <a href="index.html" class="luxury-logo">
                <span class="logo-wordmark">fyndit.</span>
            </a>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="index.html#categories">Categories</a>
                <a href="products.html">Products</a>
            </nav>

            <div class="header-actions">
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
                <a href="cart.html" class="cart-link">
                    Cart (<span id="cartCount">0</span>)
                </a>
            </div>

        </div>

    </header>


    <!-- LOGIN SECTION -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-heading">

                <p>WELCOME BACK</p>

                <h1>Sign In</h1>

                <span>
                    Log in to discover everything worth finding.
                </span>

            </div>


            <form id="loginForm">

                <div class="auth-field">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <p id="loginMessage" class="auth-message"></p>


                <button type="submit" id="loginButton">
                    SIGN IN
                </button>

            </form>


            <div class="auth-switch">

                <p>
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>


            <div class="auth-back">
                <a href="index.html">← Back to Home</a>
            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="main-footer">

        <div class="footer-content">

            <h2 class="footer-brand">fyndit.</h2>

            <p>Everything worth finding.</p>

            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
            </div>

            <p class="copyright">
                © 2026 FyndIt. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="login.js"></script>

</body>

</html>
